version: "3.9"

# POD-JD Intelligence — docker-compose
#
# Usage:
#   cp .env.example .env        # fill in your keys
#   docker compose up -d         # start MCP server + scheduler
#   docker compose run pipeline  # one-shot pipeline run
#   docker compose logs -f       # tail logs

services:

  # ── MCP server ─────────────────────────────────────────────────
  # Runs the FastMCP server as a persistent process.
  # Wire into Claude Code by adding to ~/.claude/mcp_servers.json:
  #   "pod-jd": { "command": "docker", "args": ["compose", "-f",
  #     "/path/to/pod_jd_intelligence/docker-compose.yml", "exec",
  #     "-T", "mcp-server", "python", "mcp_server.py"] }
  mcp-server:
    build:
      context: .
      target: runtime
    image: pod-jd-intelligence:latest
    container_name: pod_jd_mcp
    command: python mcp_server.py
    env_file: .env
    volumes:
      - pod_jd_output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import config; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Cron scheduler ─────────────────────────────────────────────
  # Runs `python main.py run` at 9 AM and 3 PM daily.
  # Uses supercronic for reliable cron inside containers.
  scheduler:
    build:
      context: .
      target: runtime
    image: pod-jd-intelligence:latest
    container_name: pod_jd_scheduler
    command: >
      sh -c "
        echo '0 9  * * * python /app/main.py run >> /proc/1/fd/1 2>&1' > /tmp/cron &&
        echo '0 15 * * * python /app/main.py run >> /proc/1/fd/1 2>&1' >> /tmp/cron &&
        crond -f -l 2 -c /tmp/cron
      "
    env_file: .env
    volumes:
      - pod_jd_output:/app/output
    restart: unless-stopped
    depends_on:
      - mcp-server

  # ── One-shot pipeline (manual trigger) ─────────────────────────
  # docker compose run --rm pipeline
  pipeline:
    build:
      context: .
      target: runtime
    image: pod-jd-intelligence:latest
    container_name: pod_jd_pipeline
    command: python main.py run
    env_file: .env
    volumes:
      - pod_jd_output:/app/output
    profiles:
      - manual   # not started by default; use `docker compose run pipeline`

volumes:
  pod_jd_output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./output   # maps to ./output on the host
